# kakitui configuration
# Copy to ~/.config/kakitui/config.ini (Linux/macOS) or %APPDATA%\kakitui\config.ini (Windows)
# Environment variables override: KANJI_ALIVE_API_KEY, KAKITUI_USE_API

[kanji_alive]
# RapidAPI key for Kanji Alive (https://rapidapi.com/kanjialive/api/learn-to-read-and-write-japanese-kanji/)
api_key = your_rapidapi_key_here

[kakitui]
# Data source: api = use API only; local = use bundled CSV only; auto = try API then fall back to local
use_api = auto
