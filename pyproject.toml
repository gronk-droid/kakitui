[project]
name = "kakitui"
version = "0.1.0"
description = "TUI kanji stroke-order lookup app powered by Kanji Alive"
requires-python = ">=3.12"
dependencies = [
    "textual>=3.2.0",
    "requests>=2.31.0",
    "textual-image[textual]>=0.8.0",
    "cairosvg>=2.7.0",
    "jamdict>=0.1a11",
    "jamdict-data-fix>=1.5",
]

[project.scripts]
kakitui = "kakitui.__main__:main"

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "textual-dev>=1.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kakitui"]

[tool.hatch.build.targets.wheel.force-include]
"kakitui/data/ka_data.csv" = "kakitui/data/ka_data.csv"
